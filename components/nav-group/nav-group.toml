tag = "lds-nav-group"
name = "Nav group"
category = "navigation"
status = "draft"
summary = "Collapsible section of nav items inside an lds-nav."

description = """
Groups related lds-nav-item children under a labelled trigger. Open state is
the open attribute. Inside a collapsed lds-nav, the trigger hides and items
remain visible so the icon rail stays usable.

Set href when the group is itself a destination, such as a project whose
pages (Issues, Board, Backlog) are the items. The header then becomes a link
with start and end slots (a colour swatch, a project key) and a separate
chevron button opens and closes the items. In a collapsed nav only the start
content shows.
"""

a11y = """
The trigger is a real <button> with aria-expanded reflecting open. The label
attribute is the visible (and accessible) name of the section.

- lds-toggle fires before open changes; cancel to keep the previous state.
- With href, the header is a link named by label and the chevron is a
  separate button named "Pages in <label>". current sets aria-current="page"
  on the link.
- Callers own the item names inside the group.
"""

# ---------------------------------------------------------------------------

[[attributes]]
name = "label"
type = "string"
description = "Section heading shown on the trigger."

[[attributes]]
name = "open"
type = "boolean"
description = "Expanded. Absent means collapsed (items still show in a collapsed parent nav)."

# ---------------------------------------------------------------------------

[[attributes]]
name = "href"
type = "string"
description = "Make the header a link to the group's own page; the chevron moves to a separate button."

[[attributes]]
name = "current"
type = "boolean"
description = "With href, marks the header link as the current page."

[[slots]]
name = ""
description = "Grouped lds-nav-item children."

# ---------------------------------------------------------------------------

[[slots]]
name = "start"
description = "With href: leading content of the header link, e.g. a project colour swatch. Shown in a collapsed nav."

[[slots]]
name = "end"
description = "With href: trailing secondary text, e.g. the project key."

[[events]]
name = "lds-toggle"
detail = "{ open: boolean }"
description = "Fired before open changes. Cancel to keep the previous state."

# ---------------------------------------------------------------------------

[[parts]]
name = "group"
description = "Outer wrapper."

[[parts]]
name = "trigger"
description = "The expand/collapse <button>."

[[parts]]
name = "label"
description = "Text inside the trigger."

[[parts]]
name = "chevron"
description = "Disclosure indicator."

[[parts]]
name = "items"
description = "Wrapper around the default slot."

# ---------------------------------------------------------------------------

[[parts]]
name = "header"
description = "With href: the row holding the link and the toggle."

[[parts]]
name = "link"
description = "With href: the header link."

[[parts]]
name = "toggle"
description = "With href: the disclosure button."

[[stories]]
name = "Closed and open"
description = "Two groups side by side."
html = """
<div class="lds-cluster" style="align-items: start">
  <div style="width: 15rem">
    <lds-nav-group label="Closed">
      <lds-nav-item href="#">Team</lds-nav-item>
      <lds-nav-item href="#">Billing</lds-nav-item>
    </lds-nav-group>
  </div>
  <div style="width: 15rem">
    <lds-nav-group label="Open" open>
      <lds-nav-item href="#" active>Team</lds-nav-item>
      <lds-nav-item href="#">Billing</lds-nav-item>
    </lds-nav-group>
  </div>
</div>
"""

