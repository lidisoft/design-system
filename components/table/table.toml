tag = "lds-table"
name = "Table"
category = "data"
status = "draft"
summary = "Styled light-DOM table with density, sticky header, and optional sorting."

description = """
Wraps a real <table> kept in the light DOM so text selection, find-in-page and
screen-reader table semantics stay intact. The host supplies a scroll frame,
density tokens and optional client-side column sorting.

Cell styles live in runtime/table.css (bundled into lds.css) because shadow
::slotted() cannot reach nested th/td. Host custom properties inherit into
those rules.

Mark sortable columns with data-sortable on th. Optional data-type=\"number\"
or \"date\", and data-value on cells for sort keys that differ from visible text.
"""

a11y = """
The slotted table keeps native table semantics. When sortable, data-sortable
headers are keyboard-activatable (tabindex=0) and expose aria-sort while
active. Prefer a <caption> or aria-label on the table for an accessible name.
"""

# ---------------------------------------------------------------------------

[[attributes]]
name = "density"
type = "enum"
values = ["comfortable", "compact"]
default = "comfortable"
description = "Cell padding and type size."

[[attributes]]
name = "sticky"
type = "boolean"
description = "Pin thead th while scrolling. Set --lds-table-max-height on the host."

[[attributes]]
name = "sortable"
type = "boolean"
description = "Enable sorting on th[data-sortable]. Cycles asc → desc → none."

[[attributes]]
name = "striped"
type = "boolean"
description = "Zebra-stripe body rows."

# ---------------------------------------------------------------------------

[[slots]]
name = ""
description = "A single light-DOM <table>."

# ---------------------------------------------------------------------------

[[events]]
name = "lds-sort"
detail = "{ column: HTMLTableCellElement, direction: \"asc\"|\"desc\"|null, key?: string }"
description = "Fired before rows are reordered. Cancel to skip client-side sort (e.g. server sort)."

# ---------------------------------------------------------------------------

[[parts]]
name = "frame"
description = "Scroll container around the slotted table."

# ---------------------------------------------------------------------------

[[css_vars]]
name = "--lds-table-max-height"
default = "none"
description = "Cap the frame height so sticky headers and overflow scrolling engage."

[[css_vars]]
name = "--lds-table-cell-padding-y"
default = "per density"
description = "Vertical cell padding. Inherited into light-DOM cell rules."

[[css_vars]]
name = "--lds-table-header-bg"
default = "--lds-color-bg-muted"
description = "Header cell background."

# ---------------------------------------------------------------------------

[[stories]]
name = "Basic"
description = "A plain incident table. The <table> is authored in light DOM."
html = """
<lds-table>
  <table>
    <caption>Open incidents</caption>
    <thead>
      <tr>
        <th scope="col">Incident</th>
        <th scope="col">Severity</th>
        <th scope="col">Owner</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>API latency above SLO</td>
        <td>SEV-2</td>
        <td>Ada Lovelace</td>
      </tr>
      <tr>
        <td>Disk pressure on db-03</td>
        <td>SEV-1</td>
        <td>Grace Hopper</td>
      </tr>
      <tr>
        <td>Certificate expires in 7d</td>
        <td>SEV-3</td>
        <td>Alan Turing</td>
      </tr>
    </tbody>
  </table>
</lds-table>
"""

