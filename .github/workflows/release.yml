name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Gate
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)" || {
            gofmt -l .
            echo "run gofmt -w ."
            exit 1
          }
          make vet
          make test
          make verify
          want="${GITHUB_REF_NAME#v}"
          grep -q "LDS.version = \"$want\";" dist/lds.js || {
            echo "dist/lds.js is not stamped $want: set Version in internal/generator/generator.go and run make build"
            exit 1
          }

      - name: Notes and archives
        shell: bash
        run: |
          set -euo pipefail
          version="$GITHUB_REF_NAME"
          scripts/release-notes.sh "$version" > "$RUNNER_TEMP/notes.md"
          (
            cd dist
            zip -qr "$RUNNER_TEMP/lds-$version.zip" .
          )
          tar -czf "$RUNNER_TEMP/lds-$version.tar.gz" -C dist .
          (
            cd "$RUNNER_TEMP"
            sha256sum "lds-$version.zip" "lds-$version.tar.gz" > SHA256SUMS.txt
          )

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="$GITHUB_REF_NAME"
          gh release create "$version" \
            --title "$version" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "$RUNNER_TEMP/lds-$version.zip" \
            "$RUNNER_TEMP/lds-$version.tar.gz" \
            "$RUNNER_TEMP/SHA256SUMS.txt"

  # Publishes the gallery as a static site to GitHub Pages. Since this repo is
  # a project under the lidisoft.github.io org site, and that site has a
  # custom domain (lidisoft.com) configured, this project's Pages URL is
  # automatically served at lidisoft.com/design-system — hence --base
  # matching the repo name.
  #
  # Requires this repo's Settings → Pages → Source to be set to "GitHub
  # Actions" once, by hand.
  pages:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build static gallery
        run: make site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
