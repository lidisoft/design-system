name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Gate
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)" || {
            gofmt -l .
            echo "run gofmt -w ."
            exit 1
          }
          make vet
          make test
          make verify

      - name: Notes and archives
        shell: bash
        run: |
          set -euo pipefail
          version="$GITHUB_REF_NAME"
          scripts/release-notes.sh "$version" > "$RUNNER_TEMP/notes.md"
          (
            cd dist
            zip -qr "$RUNNER_TEMP/lds-$version.zip" .
          )
          tar -czf "$RUNNER_TEMP/lds-$version.tar.gz" -C dist .
          (
            cd "$RUNNER_TEMP"
            sha256sum "lds-$version.zip" "lds-$version.tar.gz" > SHA256SUMS.txt
          )

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="$GITHUB_REF_NAME"
          gh release create "$version" \
            --title "$version" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "$RUNNER_TEMP/lds-$version.zip" \
            "$RUNNER_TEMP/lds-$version.tar.gz" \
            "$RUNNER_TEMP/SHA256SUMS.txt"
